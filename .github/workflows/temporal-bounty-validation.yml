name: Temporal bounty validation

on:
  push:
    branches: [test/temporal-sandbox-replay]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-bounty-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check all source types and architecture
        run: npm run check
      - name: Check Temporal test types against the real SDK
        run: npm exec -w @space/worker -- tsc --noEmit -p tsconfig.temporal-tests.json
      - name: Measure ordinary integration and replay suite
        run: |
          started=$(date +%s)
          npm exec -w @space/worker -- vitest run tests/temporal-sandbox.integration.test.ts
          elapsed=$(( $(date +%s) - started ))
          echo "Temporal integration and replay elapsed seconds: $elapsed"
          test "$elapsed" -lt 180
      - name: Run complete public test suite
        run: npm test
      - name: Build all workspaces
        run: npm run build
      - name: Contributor hygiene preflight
        run: npm run hygiene:preflight
