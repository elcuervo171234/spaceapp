name: Temporal bounty validation

on:
  push:
    branches: [test/temporal-sandbox-replay]
    paths:
      - apps/worker/**
      - package-lock.json
      - .github/workflows/temporal-bounty-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporal-bounty-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install exact locked dependencies
        run: npm ci
      - name: Check all source types and architecture
        run: npm run check
      - name: Install ripgrep for the complete public suite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Diagnose unchanged web handoff test
        run: npm exec -w @space/web -- vitest run tests/smoke.test.tsx -t 'focuses a browser handoff from live SSE only while the server request is active'
      - name: Diagnose isolated polling boundaries
        run: npm exec -w @space/worker -- vitest run tests/temporal-sandbox.integration.test.ts -t 'continues after 250 one-second polls'
      - name: Measure ordinary integration and replay suite
        run: |
          started=$(date +%s)
          npm exec -w @space/worker -- vitest run tests/temporal-sandbox.integration.test.ts
          elapsed=$(( $(date +%s) - started ))
          echo "Temporal integration and replay elapsed seconds: $elapsed"
          test "$elapsed" -lt 180
      - name: Run complete public test suite
        id: public_tests
        continue-on-error: true
        run: npm test
      - name: Build all workspaces
        run: npm run build
      - name: Contributor hygiene preflight
        run: npm run hygiene:preflight
      - name: Preserve any public test failure
        if: always() && steps.public_tests.outcome == 'failure'
        run: exit 1
