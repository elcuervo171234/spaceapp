name: SpaceApp64 isolated validation

on:
  push:
    branches: [test/service-runtime-closures]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spaceapp64-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install public test prerequisite
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: Type and architecture checks
        run: npm run check
      - name: Full repository tests
        run: npm test
      - name: Build all workspaces
        run: npm run build
      - name: Stage service payloads
        run: |
          for target in core browser cli; do
            node scripts/stage-container-runtime.mjs --target "$target" --output "$RUNNER_TEMP/runtime-$target"
          done
      - name: Build and test sanitized public export
        run: |
          node scripts/public-export.mjs --output "$RUNNER_TEMP/s64-public-export"
          cd "$RUNNER_TEMP/s64-public-export"
          npm ci --no-audit --no-fund
          npm run test:public
          npm run check
          npm run build
      - name: Hygiene
        run: npm run hygiene:preflight
